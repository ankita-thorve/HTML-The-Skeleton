<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Forms</title>
  </head>
  <body>
    <form action="action_page.php" method="post">
      <div>
        <label for="fname">First Name:</label>
        <input
          type="text"
          id="fname"
          name="fname"
          placeholder="Spongebob"
          required
        />
      </div>
      <br />
      <div>
        <label for="lname">Last Name:</label>
        <input type="text" id="lname" name="lname" placeholder="Squarepants" />
      </div>

      <br />
      <div>
        <label for="pass">Password:</label>
        <input type="password" id="pass" name="pass" maxlength="12" />
      </div>
      <br />
      <div>
        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Spants@gmail.com"
        />
      </div>
      <br />
      <div>
        <label for="bdate">Birth Date:</label>
        <input type="date" id="bdate" name="bdate" />
      </div>
      <br />

      <div>
        <label for="quantity">Quantity</label>
        <input
          type="number"
          name="quantity"
          id="quantity"
          value="1"
          min="1"
          max="99"
        />
      </div>
      <br />
      <div>
        <label for="title">Title:</label>

        <input type="radio" id="Mr." name="title" value="Mr." />
        <label for="Mr.">Mr.</label>

        <input type="radio" id="Mrs." name="title" value="Mrs." />
        <label for="Mrs.">Mrs.</label>

        <input type="radio" id="PhD" name="title" value="PhD" />
        <label for="PhD">PhD</label>
      </div>
      <br />
      <div>
        <label for="payment">Payment</label>
        <select name="payment" id="payment">
          <option value="visa">Visa</option>
          <option value="mastercard">Mastercard</option>
          <option value="giftcard">Giftcard</option>
        </select>
      </div>
      <br />
      <div>
        <label for="subscribe">Subscribe</label>
        <input type="checkbox" id="subscribe" name="subscribe" />
      </div>
      <br />
      <div>
        <input type="reset" />
      </div>
      <br />
      <div>
        <input type="submit" />
      </div>
    </form>
  </body>
</html>
