<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qutation & Citation</title>
  </head>
  <body>
    <h1>Qutation & Citation</h1>

    <h2>Abbreviation Element</h2>
    <!-- The <abbr> tag in HTML represents an abbreviation or acronym. It's useful for providing a full description of the abbreviated term when the user hovers over it, improving accessibility and clarity. The title attribute is used to specify the expanded form of the abbreviation. -->
    <p>
      Create web pages using <abbr title="HyperText Markup Language">HTML</abbr>
    </p>

    <br />

    <h2>Cite Tag</h2>
    <!-- The element in HTML is used to define the title of a creative work (e.g., a book, article, song, movie, painting, sculpture, etc.). It's typically used to provide a reference or citation for a source. The content inside the element is often rendered in italics by browsers, but this styling can be overridden with CSS. Visit the following resources to learn more: -->
    <p><cite>We Found Love</cite> by Rihanna</p>
    <p><cite>Super Bass</cite> by Nicki Minaj</p>

    <br />
    <h2>dfn tag</h2>
    <!-- The <dfn> element in HTML represents the defining instance of a term. It's used to indicate the specific location where a word or phrase is being defined for the first time within a document. Typically, the term being defined is included within the <dfn> tags, and often a definition or explanation of the term is provided nearby. -->
    <p>
      The <dfn>Document Object Model</dfn> (<abbr title="Document Object Model"
        >DOM</abbr
      >) creates a tree-like structure of the page.
    </p>
  </body>
</html>
