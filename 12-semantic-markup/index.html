<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Semantic HTML</title>
  </head>
  <body>
    <header>
      <!-- logo + navigation -->
    </header>

    <main>
      <!-- the majority of content -->
      <section>
        <!-- a section of the content -->
        <h1>Semantic elements</h1>
        <p>These are some of the roughly 100 semantic elements available:</p>

        <span>&lt;article&gt;</span><br />
        <span>&lt;aside&gt;</span><br />
        <span>&lt;details&gt;</span><br />
        <span>&lt;figcaption&gt;</span><br />
        <span>&lt;figure&gt;</span><br />
        <span>&lt;footer&gt;</span><br />
        <span>&lt;form&gt;</span><br />
        <span>&lt;header&gt;</span><br />
        <span>&lt;main&gt;</span><br />
        <span>&lt;mark&gt;</span><br />
        <span>&lt;nav&gt;</span><br />
        <span>&lt;section&gt;</span><br />
        <span>&lt;summary&gt;</span><br />
        <span>&lt;time&gt;</span><br />
      </section>
      <section>
        <!-- another section -->
      </section>
      <section>
        <!-- yet another -->
      </section>
    </main>

    <footer>
      <!-- copyright, some section too, social media links -->
    </footer>
  </body>
</html>
