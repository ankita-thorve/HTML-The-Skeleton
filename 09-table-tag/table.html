<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table Tag</title>
  </head>
  <body>
    <!-- What is a table?
A table is a structured set of data made up of rows and columns (tabular data). A table allows you to quickly and easily look up values that indicate a connection between different types of data, for example, a person and their age, a day of the week, or the timetable for a local swimming pool. -->
    <!-- <table>
      <tr>
        <td>Hi, I'm your first cell</td>
        <td>I'm your second cell</td>
        <td>I'm your third cell</td>
        <td>I'm your fourth cell</td>
      </tr>
    </table> -->

    <table border="1" style="border-collapse: collapse">
      <thead>
        <tr>
          <th>S.N.</th>
          <th>Item</th>
          <th>Quantity</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>Apple</td>
          <td>2</td>
        </tr>
        <tr>
          <td>2</td>
          <td>Mango</td>
          <td>2</td>
        </tr>
        <tr>
          <td>3</td>
          <td>Orange</td>
          <td>1</td>
        </tr>
      </tbody>
      <tfoot>
        <td>&nbsp</td>
        <td>Total</td>
        <td>5</td>
      </tfoot>
    </table>
    <br />

    <table border="1" style="border-collapse: collapse;">
      <caption>This is how I spend my day!</caption>
      <thead>
        <tr>
          <th>Time</th>
          <th>Activity</th>
        </tr>

        <tr>
          <td>
            <time datetime="08:00">8am</time>-<time datetime="11:00">11am</time>
          </td>
          <td>Write Code</td>
        </tr>
        <tr>
          <td>
            <time datetime="11:00">11am</time>-<time datetime="12:00"
              >12pm</time
            >
          </td>
          <td>Eat Lunch</td>
        </tr>
        <tr>
          <td>
            <time datetime="12:00">12pm</time>-<time datetime="17:00">5pm</time>
          </td>
          <td>Study for other courses</td>
        </tr>
        <tr>
          <td rowspan="2">All Other Times</td>
          <td>Free Time</td>
        </tr>
        <tr>
          <td>Sleep</td>
        </tr>
      </thead>
      <tfoot>
        <tr><td colspan="2">All I want to eat, sleep, and code all day and ReCharge!</td></tr>
      </tfoot>
    </table>
  </body>
</html>
